<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AURA · Entrar</title>
<style>*{box-sizing:border-box}body{font:16px Segoe UI,Arial;background:#f3f3ed;color:#213b3b;margin:0}main{max-width:460px;margin:9vh auto;padding:28px;background:white;border:1px solid #dce3dc;border-radius:16px}label{display:block;margin:18px 0}input,button{font:inherit;padding:12px;border-radius:7px;width:100%;border:1px solid #acbdb6}input{margin-top:6px}button{background:#174b46;color:white;cursor:pointer}p{line-height:1.5}#error{color:#9b2424}a{color:#174b46}@media(max-width:500px){main{margin:20px}}</style>
<main><h1>AURA · Acesso da equipe</h1><p id="intro">Entre com seu login individual.</p>
<form id="login"><label>Login<input id="username" autocomplete="username" required maxlength="40"></label><label>Senha<input id="password" type="password" autocomplete="current-password" required maxlength="128"></label><button>Entrar</button></form>
<form id="change" hidden><label>Senha atual<input id="old" type="password" autocomplete="current-password" required maxlength="128"></label><label>Nova senha (mínimo 12 caracteres)<input id="new" type="password" autocomplete="new-password" required minlength="12" maxlength="128"></label><label>Confirme a nova senha<input id="confirm" type="password" autocomplete="new-password" required minlength="12" maxlength="128"></label><button>Salvar nova senha</button></form>
<p id="error" role="alert"></p><a href="/">Voltar ao concierge</a><p id="first" style="font-size:13px">Primeiro acesso: consulte o arquivo local de acesso inicial disponibilizado pelo administrador.</p></main>
<script>const $=s=>document.querySelector(s);let who=null;
function show(user){who=user;$('#login').hidden=true;$('#change').hidden=false;$('#intro').textContent=(user.must_change?'Troque sua senha temporária para continuar.':'Alterar sua senha.')+' Login: '+user.username;$('#first').hidden=true}
async function api(path,body){const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const data=await r.json();if(!r.ok)throw Error(data.error);return data}
$('#login').onsubmit=async e=>{e.preventDefault();$('#error').textContent='';const b=e.submitter;b.disabled=true;try{const u=await api('/api/auth/login',{username:$('#username').value,password:$('#password').value});$('#password').value='';if(u.must_change)show(u);else location.href=u.permissions.includes('reception')?'/recepcao':u.permissions.includes('policies')?'/politicas':'/equipe'}catch(e){$('#error').textContent=e.message}finally{b.disabled=false}};
$('#change').onsubmit=async e=>{e.preventDefault();$('#error').textContent='';if($('#new').value!==$('#confirm').value){$('#error').textContent='As novas senhas não correspondem.';return}const b=e.submitter;b.disabled=true;try{await api('/api/auth/password',{old_password:$('#old').value,password:$('#new').value});$('#change').reset();$('#change').hidden=true;$('#login').hidden=false;$('#username').value=who.username;$('#intro').textContent='Senha atualizada. Entre novamente.'}catch(e){$('#error').textContent=e.message}finally{b.disabled=false}};
fetch('/api/auth/me').then(async r=>{if(r.ok)show(await r.json())});</script></html>
